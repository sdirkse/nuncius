# Runs the tests on every pull request, so a failure shows up before the merge (and before a release).
name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tests need macOS: they run the real sandbox (sandbox-exec).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
